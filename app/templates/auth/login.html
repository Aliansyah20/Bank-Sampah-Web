<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Sistem Bank Sampah SADA</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .auth-card { background: white; padding: 32px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); width: 100%; max-width: 380px; box-sizing: border-box; }
        .auth-card h2 { margin: 0 0 5px 0; color: #1e293b; text-align: center; }
        .auth-card p { color: #64748b; font-size: 13px; text-align: center; margin: 0 0 20px 0; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #334155; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }

        .password-field { position: relative; width: 100%; }
        .password-field input { padding-right: 42px; }
        .toggle-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px; color: #64748b; }

        .btn-auth { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-auth:hover { background: #1d4ed8; }
        .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; font-weight: bold; }
        .alert-danger { background: #fee2e2; color: #991b1b; }
        .alert-warning { background: #fef3c7; color: #92400e; }
        .alert-success { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>♻️ SADA</h2>
        <p>Sampah Jadi Dana — Masuk ke Sistem RW</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }}">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/auth/login" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Masukkan username Anda" required>
            </div>

            <div class="form-group">
                <label>Kata Sandi</label>
                <div class="password-field">
                    <input type="password" id="loginPassword" name="password" placeholder="Masukkan kata sandi" required>
                    <button type="button" class="toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" title="Tampilkan/Sembunyikan">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-auth">Masuk ke Akun</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px;">
            Petugas baru? <a href="/auth/register" style="color: #16a34a; text-decoration: none; font-weight: bold;">Daftar akun petugas</a>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "🙈";
            } else {
                input.type = "password";
                btn.textContent = "👁️";
            }
        }
    </script>
</body>
</html>
