{% extends "dashboard/base_sekben.html" %}

{% block title %}Terima Setoran - Sekben{% endblock %}

{% block extra_css %}
<style>
    .form-container { background: white; padding: 30px; border-radius: 8px; max-width: 500px; box-shadow: 0 4px 8px rgba(0,0,0,0.08); }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; }
    select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
</style>
{% endblock %}

{% block content %}
    <h2>📝 Formulir Penyetoran Sampah</h2>

    <div class="form-container">
        <form method="POST" action="/sekben/terima-setoran">
            <div class="form-group">
                <label>Pilih Warga Penyetor:</label>
                <select name="id_warga" required>
                    <option value="">-- Pilih Warga --</option>
                    {% for w in warga_list %}
                        <option value="{{ w.id }}">{{ w.nama_lengkap }} ({{ w.username }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Jenis Sampah:</label>
                <select name="id_jenis_sampah" required>
                    <option value="">-- Pilih Jenis Sampah --</option>
                    {% for j in jenis_sampah_list %}
                        <option value="{{ j.id }}">{{ j.nama_jenis }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Taksiran Berat Awal (Kg):</label>
                <input type="number" step="0.01" name="berat_awal" placeholder="Contoh: 3.5" required>
            </div>

            <button type="submit">SIMPAN SETORAN</button>
        </form>
    </div>
{% endblock %}
