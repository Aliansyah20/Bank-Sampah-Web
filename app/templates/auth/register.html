<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Bank Sampah</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #27ae60 100%);
            padding: 25px 20px;
        }
        .register-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 460px;
            padding: 35px 30px;
        }
        .register-header { text-align: center; margin-bottom: 20px; }
        .register-header h2 { color: #2c3e50; font-size: 22px; font-weight: 700; }
        .register-header p { color: #7f8c8d; font-size: 13px; margin-top: 4px; }

        /* Pilihan Tab Kategori */
        .tab-wrapper {
            display: flex;
            background: #f1f2f6;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 600;
            color: #7f8c8d;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: white;
            color: #27ae60;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .tab-btn.active.petugas {
            color: #2980b9;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #34495e; margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #dcdde1;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #27ae60;
            box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s ease;
        }
        .btn-green { background: #27ae60; }
        .btn-blue { background: #2980b9; }
        .btn-submit:hover { opacity: 0.9; }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #555;
        }
        .footer-link a { color: #2980b9; text-decoration: none; font-weight: 700; }
        .footer-link a:hover { text-decoration: underline; }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .alert-danger { background: #fde8e8; color: #c81e1e; border: 1px solid #f8b4b4; }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="register-header">
            <h2>Pendaftaran Akun</h2>
            <p>Pilih jenis akun yang ingin didaftarkan</p>
        </div>

        <!-- Tombol Pengalih Kategori Akun -->
        <div class="tab-wrapper">
            <button type="button" class="tab-btn active" id="tabWarga" onclick="switchTab('warga')">
                🌱 Warga Penyetor
            </button>
            <button type="button" class="tab-btn" id="tabPetugas" onclick="switchTab('petugas')">
                🛡️ Petugas / Pengurus
            </button>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- FORM 1: WARGA -->
        <form id="formWarga" action="/auth/register" method="POST">
            <input type="hidden" name="tipe_daftar" value="warga">
            
            <div class="form-group">
                <label>Nama Lengkap Warga</label>
                <input type="text" name="nama_lengkap" placeholder="Contoh: Budi Santoso" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Buat username login" required>
            </div>

            <div class="form-group">
                <label>Kata Sandi</label>
                <input type="password" name="password" placeholder="Minimal 6 karakter" required>
            </div>

            <div class="form-group">
                <label>Konfirmasi Kata Sandi</label>
                <input type="password" name="konfirmasi_password" placeholder="Ulangi kata sandi" required>
            </div>

            <button type="submit" class="btn-submit btn-green">DAFTAR SEBAGAI WARGA</button>
        </form>

        <!-- FORM 2: PETUGAS (SEKBEN / PENGOLAH / PENGAWAS/Tim marketing) -->
        <form id="formPetugas" action="/auth/register" method="POST" style="display: none;">
            <input type="hidden" name="tipe_daftar" value="petugas">

            <div class="form-group">
                <label>Nama Lengkap Petugas</label>
                <input type="text" name="nama_lengkap" placeholder="Contoh: Siti Rahmawati" required>
            </div>

            <div class="form-group">
                <label>Posisi / Peran Tugas</label>
                <select name="role" required>
                    <option value="">-- Pilih Penugasan --</option>
                    <option value="sekben">Sekretaris / Bendahara (Sekben)</option>
                    <option value="pengolah">Pengolah Sampah (Verifikator Timbangan)</option>
                    <option value="pengawas">Pengawas Operasional</option>
                    <option value="marketing">Tim Marketing (Penjualan & Pengepul)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Username Petugas</label>
                <input type="text" name="username" placeholder="Buat username petugas" required>
            </div>

            <div class="form-group">
                <label>Kata Sandi</label>
                <input type="password" name="password" placeholder="Minimal 6 karakter" required>
            </div>

            <div class="form-group">
                <label>Konfirmasi Kata Sandi</label>
                <input type="password" name="konfirmasi_password" placeholder="Ulangi kata sandi" required>
            </div>

            <button type="submit" class="btn-submit btn-blue">DAFTAR SEBAGAI PETUGAS</button>
        </form>

        <div class="footer-link">
            Sudah memiliki akun? <a href="/auth/login">Masuk di sini</a>
        </div>
    </div>

    <!-- Script Tab Switcher -->
    <script>
        function switchTab(type) {
            const formWarga = document.getElementById('formWarga');
            const formPetugas = document.getElementById('formPetugas');
            const tabWarga = document.getElementById('tabWarga');
            const tabPetugas = document.getElementById('tabPetugas');

            if (type === 'warga') {
                formWarga.style.display = 'block';
                formPetugas.style.display = 'none';
                tabWarga.className = 'tab-btn active';
                tabPetugas.className = 'tab-btn';
            } else {
                formWarga.style.display = 'none';
                formPetugas.style.display = 'block';
                tabWarga.className = 'tab-btn';
                tabPetugas.className = 'tab-btn active petugas';
            }
        }
    </script>
</body>
</html>
