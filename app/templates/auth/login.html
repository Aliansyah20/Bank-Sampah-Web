<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bank Sampah</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; color: #2c3e50;">Login Bank Sampah</h2>
        
        <!-- Pesan Error (Jika Username/Pass salah) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="color: red; margin-bottom: 10px; font-size: 14px; text-align: center;">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/auth/login" method="POST" style="display: flex; flex-direction: column; gap: 15px; width: 300px;">
            <input type="text" name="username" placeholder="Username" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            <input type="password" name="password" placeholder="Password" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            <button type="submit" style="padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">MASUK</button>
        </form>
    </div>

</body>
</html>
